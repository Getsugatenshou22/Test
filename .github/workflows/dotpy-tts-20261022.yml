name: DotPy Day Four Natural Voice Render
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [dotpy-test-neural-voice-20261022]
permissions:
  contents: read
jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install natural speech generator
        run: python -m pip install --disable-pip-version-check edge-tts mutagen
      - name: Synthesize 52 complete Day Four lessons
        run: python dotpy_day4_temp/render.py
      - name: Validate all narration clips
        run: |
          test "$(find voice -name '*.mp3' | wc -l)" -eq 52
          test -s voice/manifest.json
          du -sh voice
      - uses: actions/upload-artifact@v4
        with:
          name: dotpy-day4-neural-voice-all52
          path: voice/
          retention-days: 1
          if-no-files-found: error
