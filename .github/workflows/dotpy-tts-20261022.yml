name: DotPy Neural Audio Connectivity Test
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [dotpy-test-neural-voice-20261022]
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: python -m pip install edge-tts
      - run: |
          edge-tts --voice en-ZA-LukeNeural --text "Welcome to DotPy. This is a natural voice connectivity test." --write-media sample.mp3
          test -s sample.mp3
          du -h sample.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: sample
          path: sample.mp3
          retention-days: 1
